<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pinpoint — HTML Annotator</title>
<style>
  /* ============================================================
     APP CHROME + THEME TOKENS
     ============================================================ */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-rows: 1fr;
    overflow: hidden;
    --radius: 3px;
    --ctrl-h: 32px;    /* uniform height for every button & segmented control */
    --fs-ui: 12.5px;   /* uniform UI text size */
  }
  /* Theme tokens — the only thing the toggle swaps. */
  body[data-theme="light"] {
    --bg:#f4f4f5; --panel:#ffffff; --text:#18181b; --dim:#71717a; --faint:#a1a1aa;
    --border:#e4e4e7; --accent:#18181b; --accent-soft:#f4f4f5; --accent-ink:#ffffff;
  }
  body[data-theme="dark"] {
    --bg:#0e0e10; --panel:#161618; --text:#ededee; --dim:#9a9aa0; --faint:#65656b;
    --border:#2a2a2d; --accent:#ededee; --accent-soft:rgba(237,237,238,0.08); --accent-ink:#161618;
  }

  #shells { position: relative; overflow: hidden; }
  .shell { position: absolute; inset: 0; }
  .shell[hidden] { display: none !important; }

  /* ============================================================
     SHARED COMPONENTS (driven by theme tokens)
     ============================================================ */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    height: 50px; padding: 0 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    user-select: none;
  }
  .brand { font-weight: 600; font-size: 15.5px; letter-spacing: -0.01em; }
  .brand b { color: var(--accent); }
  .topbar .spacer { flex: 1; }
  .file-name {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
    color: var(--dim); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .counts { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .counts b { color: var(--accent); font-weight: 600; }

  /* Minimal-Mono family signature: mono on the key chrome */
  .brand, .counts, .annot-num, .panel-title { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .seg { display: inline-flex; height: var(--ctrl-h); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .seg button {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; border: 0; color: var(--dim);
    padding: 0 13px; font: inherit; font-size: var(--fs-ui); cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .seg button:hover:not(.on) { background: var(--bg); color: var(--text); }

  .canvas { display: flex; justify-content: center; padding: 18px; overflow: hidden; }
  .frame-wrap {
    width: 100%; max-width: 1060px; height: 100%;
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: 0 8px 34px rgba(0,0,0,0.12); overflow: hidden;
  }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }

  .panel { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .panel-head { padding: 13px 14px; border-bottom: 1px solid var(--border); }
  .panel-title { font-weight: 600; font-size: 14px; margin-bottom: 9px; }
  .global-wrap label {
    display: block; font-size: 10px; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--faint); margin-bottom: 5px;
  }
  .global-wrap textarea {
    width: 100%; min-height: 44px; resize: vertical;
    border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px;
    font: inherit; font-size: 12.5px; color: var(--text);
    background: var(--bg); outline: none; line-height: 1.45;
  }
  .global-wrap textarea:focus { border-color: var(--accent); }

  .annot-list { flex: 1; overflow: auto; padding: 10px; }
  .annot-list:empty::before {
    content: 'Switch to Inspect, hover the preview, then click any element to leave a note.';
    display: block; padding: 24px 16px; color: var(--faint);
    font-size: 12.5px; text-align: center; line-height: 1.55;
  }
  .annot {
    background: var(--bg); border: 1px solid var(--border);
    border-left: 3px solid var(--accent); border-radius: var(--radius);
    padding: 9px 11px; margin-bottom: 8px; cursor: pointer;
    transition: box-shadow .12s, background .12s;
  }
  .annot:hover { background: var(--accent-soft); }
  .annot.selected { box-shadow: 0 0 0 2px var(--accent); }
  .annot-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .annot-num { font-size: 11px; font-weight: 600; color: var(--accent); }
  .annot-actions { display: flex; gap: 2px; }
  .annot-actions button {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; padding: 0;
    background: transparent; border: 0; color: var(--faint);
    cursor: pointer; font-size: 12px; border-radius: 4px;
  }
  .annot-actions button:hover { color: var(--text); background: var(--bg); }
  .annot-actions button.danger:hover { color: #dc2626; }
  .annot-selector {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
    color: var(--accent); background: var(--accent-soft);
    padding: 3px 6px; border-radius: 5px; margin-bottom: 6px; word-break: break-all;
  }
  .annot-preview {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10.5px;
    color: var(--dim); background: var(--bg);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 3px 6px; margin-bottom: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .annot textarea {
    width: 100%; min-height: 52px; resize: vertical;
    border: 1px solid var(--border); border-radius: var(--radius); padding: 7px;
    font: inherit; font-size: 12.5px; color: var(--text);
    background: var(--panel); outline: none; line-height: 1.45;
  }
  .annot textarea:focus { border-color: var(--accent); }

  .panel-foot {
    display: flex; align-items: center; gap: 6px;
    padding: 10px; border-top: 1px solid var(--border);
  }
  .panel-foot .spacer { flex: 1; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: var(--ctrl-h); padding: 0 14px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: var(--radius); font: inherit; font-size: var(--fs-ui);
    white-space: nowrap; cursor: pointer;
    transition: border-color .12s, background .12s, color .12s, filter .12s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(0.5px); }
  .btn.ghost { border-color: transparent; color: var(--dim); padding: 0 10px; }
  .btn.ghost:hover { color: var(--text); background: var(--bg); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  /* square, icon-only button — same height as text buttons */
  .btn.theme-toggle { width: var(--ctrl-h); padding: 0; font-size: 14px; }

  /* ============================================================
     SHELL LAYOUT — top toolbar + canvas + right sidebar.
     ============================================================ */
  .shell {
    display: grid;
    grid-template-rows: 50px 1fr;
    grid-template-columns: 1fr var(--sidebar, 380px);
    grid-template-areas: "top top" "canvas panel";
    background: var(--bg); color: var(--text);
  }
  .topbar { grid-area: top; }
  .canvas { grid-area: canvas; }
  .panel  { grid-area: panel; border-left: 1px solid var(--border); }

  /* ============================================================
     FLOATING HOVER LABEL (positioned over the active iframe)
     ============================================================ */
  .hover-label {
    position: fixed; z-index: 9999; display: none;
    background: #0f172a; color: #fff;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
    padding: 4px 8px; border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.32);
    max-width: 460px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; pointer-events: none;
  }
  .hover-label .t { color: #818cf8; font-weight: 700; }
  .hover-label .s { opacity: 0.65; }

  /* ============================================================
     MODAL (themed confirm dialog)
     ============================================================ */
  .modal {
    position: fixed; inset: 0; z-index: 10000;
    background: rgba(15,23,42,0.6);
    display: none; align-items: center; justify-content: center; padding: 32px;
  }
  .modal.show { display: flex; }
  .modal-card {
    background: var(--panel); color: var(--text); width: 100%; max-width: 720px; max-height: 82vh;
    border-radius: 16px; overflow: hidden;
    display: grid; grid-template-rows: auto 1fr auto;
    box-shadow: 0 30px 80px rgba(0,0,0,0.42);
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { margin: 0; font-size: 16px; }
  .modal-body { overflow: auto; padding: 18px 20px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 13px 20px; border-top: 1px solid var(--border); }
  .modal-foot .btn { padding: 0 16px; }
  .modal-foot .btn:hover { border-color: var(--accent); }
  .modal-foot .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

  /* confirm dialog */
  .confirm-card { max-width: 420px; }
  .confirm-card .modal-body p { margin: 0; color: var(--text); font-size: 13.5px; line-height: 1.55; }
  .btn.danger-btn, .modal-foot .btn.danger-btn { background: #dc2626; border-color: #dc2626; color: #fff; }
  .btn.danger-btn:hover, .modal-foot .btn.danger-btn:hover { filter: brightness(1.07); border-color: #dc2626; }

  /* ============================================================
     DONE OVERLAY (after Approve / Send Feedback / close)
     ============================================================ */
  .done-overlay { position: fixed; inset: 0; z-index: 10002; display: none; align-items: center; justify-content: center; background: var(--bg); }
  .done-overlay.show { display: flex; }
  .done-card { text-align: center; max-width: 460px; padding: 32px; }
  .done-icon {
    width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center; font-size: 30px;
  }
  .done-card h2 { margin: 0 0 8px; font-size: 20px; }
  .done-card p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.6; }

  /* stale annotation (selector no longer matches the rendered page) */
  .annot.missing { border-left-color: #f59e0b; }
  .annot-warn { color: #d97706; font-size: 11px; margin: -2px 0 6px; }
  .annot-actions button[disabled] { opacity: 0.35; cursor: not-allowed; }

  /* keyboard focus visibility */
  button:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* toast — inverted pill, themed */
  .toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 10001;
    transform: translateX(-50%) translateY(8px);
    background: var(--text); color: var(--bg);
    padding: 9px 16px; border-radius: 9px; font-size: 13px; font-weight: 500;
    box-shadow: 0 10px 30px rgba(0,0,0,0.32);
    opacity: 0; pointer-events: none; max-width: 80vw; text-align: center;
    transition: opacity .18s ease, transform .18s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* thin scrollbars */
  .annot-list::-webkit-scrollbar, .modal-body::-webkit-scrollbar { width: 9px; }
  .annot-list::-webkit-scrollbar-thumb, .modal-body::-webkit-scrollbar-thumb { background: rgba(120,120,120,0.35); border-radius: 9px; }
</style>
</head>
<body data-theme="light">

<div id="shells"></div>

<div class="hover-label" id="hover-label"></div>

<div class="modal" id="confirm-modal">
  <div class="modal-card confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-msg">
    <div class="modal-head">
      <h3 id="confirm-title">Confirm</h3>
    </div>
    <div class="modal-body"><p id="confirm-msg"></p></div>
    <div class="modal-foot">
      <button type="button" class="btn" id="confirm-cancel">Cancel</button>
      <button type="button" class="btn primary" id="confirm-ok">Confirm</button>
    </div>
  </div>
</div>

<div class="done-overlay" id="done" role="status" aria-live="polite">
  <div class="done-card">
    <div class="done-icon" id="done-icon">&#10003;</div>
    <h2 id="done-title">Feedback sent</h2>
    <p id="done-msg">You can close this tab and return to Claude Code.</p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   Server-injected config. window.__PINPOINT__ is written
   into the page by src/server.ts before </head>.
   ========================================================= */
const CFG = window.__PINPOINT__ || {
  filePath: '(unknown)', fileName: '(unknown)', targetUrl: 'about:blank', apiBase: '/__pinpoint',
};

/* In-iframe badge styling — fixed (independent of the app theme) so badges
   stay visible on the user's mockup, which is usually a light page. */
const DIRS = {
  a: { accent: '#18181b', tint: 'rgba(24,24,27,0.06)', badgeText: '#fff', badgeRadius: '3px' },
};

/* Toolbar + canvas + sidebar markup for the shell. */
const CHROME = `
  <header class="topbar">
    <div class="brand">Pin<b>point</b></div>
    <div class="seg">
      <button data-role="mode-inspect" class="on">&#8982; Inspect</button>
      <button data-role="mode-browse">&#8599; Browse</button>
    </div>
    <div class="file-name" data-role="file-name" title=""></div>
    <div class="spacer"></div>
    <div class="counts" data-role="counts">0 annotations</div>
    <button type="button" class="btn ghost theme-toggle" data-role="theme-toggle" title="Toggle light / dark theme" aria-label="Toggle light or dark theme"><span data-role="theme-icon">&#127769;</span></button>
  </header>
  <div class="canvas" data-role="canvas">
    <div class="frame-wrap">
      <iframe data-role="frame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
    </div>
  </div>
  <aside class="panel" data-role="panel">
    <div class="panel-head">
      <div class="panel-title">Annotations</div>
      <div class="global-wrap">
        <label>Page-wide note</label>
        <textarea data-role="global-comment" placeholder="Overall feedback on the whole page&hellip;"></textarea>
      </div>
    </div>
    <div class="annot-list" data-role="annot-list"></div>
    <div class="panel-foot">
      <button class="btn ghost" data-role="clear-all">Clear</button>
      <div class="spacer"></div>
      <button class="btn" data-role="finalize-approve">Approve</button>
      <button class="btn primary" data-role="finalize-send">Send Feedback</button>
    </div>
  </aside>`;

/* =========================================================
   State (single source of truth)
   - annotations + comments: sessionStorage (cleared when the tab/session ends)
   - theme: localStorage (a UI preference that persists across sessions)
   ========================================================= */
const SS_KEY = 'pinpoint:comments';   // sessionStorage — annotations & comments
const THEME_KEY = 'pinpoint:theme';   // localStorage — theme preference only
const state = {
  globalComment: '',
  annotations: [],
  selectedId: null,
  mode: 'inspect',
  theme: 'light',
};
const shells = {};      // dir -> { el, iframe }
let active = null;      // active shell element

const hoverLabel = document.getElementById('hover-label');

/* =========================================================
   Persistence
   ========================================================= */
function persist() {
  try {
    sessionStorage.setItem(SS_KEY, JSON.stringify({
      globalComment: state.globalComment,
      annotations: state.annotations,
    }));
  } catch (e) {}
  try { localStorage.setItem(THEME_KEY, state.theme); } catch (e) {}
}
function loadPersisted() {
  try {
    const raw = sessionStorage.getItem(SS_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      state.globalComment = d.globalComment || '';
      state.annotations = Array.isArray(d.annotations) ? d.annotations : [];
    }
  } catch (e) {}
  try {
    const t = localStorage.getItem(THEME_KEY);
    if (t === 'light' || t === 'dark') state.theme = t;
  } catch (e) {}
}

/* =========================================================
   Small helpers
   ========================================================= */
const q = (role) => active && active.querySelector(`[data-role="${role}"]`);
const activeDoc = () => active && shells[active.dataset.dir].iframe.contentDocument;
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
}
/* Does this annotation's selector still resolve in the rendered page?
   Returns true while the doc is still loading (don't flag prematurely). */
function elementExists(doc, selector) {
  if (!doc) return true;
  try { return !!doc.querySelector(selector); } catch (e) { return false; }
}

/* =========================================================
   CSS selector generation (ported from annotator.html)
   ========================================================= */
function cssEscape(s) {
  return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/([^\w-])/g, '\\$1');
}
function getSelector(el) {
  const doc = el.ownerDocument;
  if (el.id && doc.querySelectorAll('#' + cssEscape(el.id)).length === 1) {
    return '#' + cssEscape(el.id);
  }
  const parts = [];
  let cur = el;
  while (cur && cur.nodeType === 1 && cur !== doc.body && cur !== doc.documentElement) {
    let part = cur.tagName.toLowerCase();
    if (cur.id && doc.querySelectorAll('#' + cssEscape(cur.id)).length === 1) {
      parts.unshift('#' + cssEscape(cur.id));
      break;
    }
    const classes = Array.from(cur.classList).filter(c => !c.startsWith('__pp-'));
    if (classes.length) part += '.' + classes.slice(0, 2).map(cssEscape).join('.');
    const parent = cur.parentNode;
    if (parent && parent.children) {
      const sameTag = Array.from(parent.children).filter(c => c.tagName === cur.tagName);
      if (sameTag.length > 1) part += `:nth-of-type(${sameTag.indexOf(cur) + 1})`;
    }
    parts.unshift(part);
    cur = cur.parentNode;
  }
  return parts.join(' > ');
}
function shortOuter(el, max = 200) {
  const html = (el.outerHTML || '').replace(/\s+/g, ' ').trim();
  return html.length > max ? html.slice(0, max) + '…' : html;
}

/* =========================================================
   Build shells
   ========================================================= */
function buildShells() {
  const root = document.getElementById('shells');
  ['a'].forEach(dir => {
    const shell = document.createElement('div');
    shell.className = 'shell';
    shell.dataset.dir = dir;
    shell.hidden = true;
    shell.innerHTML = CHROME;
    root.appendChild(shell);

    const fn = shell.querySelector('[data-role="file-name"]');
    if (fn) { fn.textContent = CFG.fileName; fn.title = CFG.filePath; }

    const iframe = shell.querySelector('[data-role="frame"]');
    iframe.addEventListener('load', () => onFrameLoad(dir));
    iframe.src = CFG.targetUrl;   // the user's real file, served by the local server

    shells[dir] = { el: shell, iframe };
    wireShell(dir);
  });
}

function wireShell(dir) {
  const s = shells[dir].el;
  s.querySelector('[data-role="mode-inspect"]').onclick = () => setMode('inspect');
  s.querySelector('[data-role="mode-browse"]').onclick = () => setMode('browse');
  s.querySelector('[data-role="global-comment"]').addEventListener('input', e => {
    state.globalComment = e.target.value; persist();
  });
  s.querySelector('[data-role="clear-all"]').onclick = clearAll;
  s.querySelector('[data-role="finalize-approve"]').onclick = onApprove;
  s.querySelector('[data-role="finalize-send"]').onclick = onSend;
  s.querySelector('[data-role="theme-toggle"]').onclick = toggleTheme;
}

/* =========================================================
   Iframe load: inject overlay CSS + attach handlers
   ========================================================= */
function onFrameLoad(dir) {
  let doc;
  try { doc = shells[dir].iframe.contentDocument; } catch (e) { doc = null; }
  if (!doc) return;
  injectOverlay(doc, dir);
  attachHandlers(doc, dir);
  doc.body.classList.toggle('__pp-inspect', state.mode === 'inspect');
  reapply(doc);
  if (active && active.dataset.dir === dir) render();
}

function injectOverlay(doc, dir) {
  const c = DIRS[dir];
  const pre = c.badgePre || '', suf = c.badgeSuf || '';
  const old = doc.getElementById('__pp-styles');
  if (old) old.remove();
  const style = doc.createElement('style');
  style.id = '__pp-styles';
  style.textContent = `
    .__pp-hover { outline: 2px solid ${c.accent} !important; outline-offset: -2px !important; cursor: crosshair !important; background-color: ${c.tint} !important; }
    .__pp-tagged { outline: 2px dashed ${c.accent} !important; outline-offset: -2px !important; position: relative !important; }
    .__pp-tagged::before {
      content: "${pre}" attr(data-pp-num) "${suf}" !important;
      position: absolute !important; top: -10px !important; left: -10px !important;
      min-width: 20px !important; height: 20px !important; padding: 0 5px !important;
      background: ${c.accent} !important; color: ${c.badgeText} !important;
      font: 700 11px/20px ui-monospace, monospace !important;
      border-radius: ${c.badgeRadius} !important;
      display: flex !important; align-items: center !important; justify-content: center !important;
      z-index: 99999 !important; box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,0.28) !important;
      pointer-events: none !important;
    }
    .__pp-selected { outline: 3px solid ${c.accent} !important; outline-offset: -3px !important; }
    body.__pp-inspect, body.__pp-inspect * { cursor: crosshair !important; }
  `;
  doc.head.appendChild(style);
}

function attachHandlers(doc, dir) {
  let hovered = null;
  doc.addEventListener('mouseover', (e) => {
    if (state.mode !== 'inspect') return;
    const t = e.target;
    if (!t || t === doc.body || t === doc.documentElement) return;
    if (hovered && hovered !== t) hovered.classList.remove('__pp-hover');
    t.classList.add('__pp-hover');
    hovered = t;
    showHover(t, e, dir);
  }, true);
  doc.addEventListener('mouseout', (e) => {
    if (state.mode !== 'inspect') return;
    if (e.target === hovered) { e.target.classList.remove('__pp-hover'); hovered = null; hideHover(); }
  }, true);
  doc.addEventListener('mousemove', (e) => {
    if (state.mode !== 'inspect' || !hovered) return;
    posHover(e, dir);
  }, true);
  doc.addEventListener('click', (e) => {
    if (state.mode !== 'inspect') return;
    e.preventDefault(); e.stopPropagation();
    const t = e.target;
    if (!t || t === doc.body || t === doc.documentElement) return;
    active = shells[dir].el;
    addAnnotation(t);
  }, true);
  // pointer leaving the iframe content shouldn't leave a stuck label
  doc.documentElement.addEventListener('mouseleave', hideHover);
}

/* =========================================================
   Hover label
   ========================================================= */
function showHover(el, evt, dir) {
  const sel = getSelector(el);
  const tag = el.tagName.toLowerCase();
  const classes = Array.from(el.classList).filter(c => !c.startsWith('__pp-'));
  let html = `<span class="t">&lt;${tag}&gt;</span>`;
  if (el.id) html += ` #${escapeHtml(el.id)}`;
  if (classes.length) html += ` .${escapeHtml(classes.join('.'))}`;
  html += ` <span class="s">${escapeHtml(sel)}</span>`;
  hoverLabel.innerHTML = html;
  hoverLabel.style.display = 'block';
  posHover(evt, dir);
}
function posHover(evt, dir) {
  const r = shells[dir].iframe.getBoundingClientRect();
  const x = r.left + evt.clientX + 14;
  const y = r.top + evt.clientY + 14;
  hoverLabel.style.left = Math.min(x, window.innerWidth - 470) + 'px';
  hoverLabel.style.top = Math.min(y, window.innerHeight - 34) + 'px';
}
function hideHover() {
  hoverLabel.style.display = 'none';
  const doc = activeDoc();
  if (doc) doc.querySelectorAll('.__pp-hover').forEach(el => el.classList.remove('__pp-hover'));
}

/* =========================================================
   Annotation CRUD
   ========================================================= */
function addAnnotation(el) {
  // Drop any earlier annotation the user started but left blank before
  // beginning a new one — an annotation only exists once it has a comment.
  pruneEmpty();
  const annot = {
    id: 'a_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    selector: getSelector(el),
    tag: el.tagName.toLowerCase(),
    text: (el.textContent || '').trim().slice(0, 120),
    outerHTML: shortOuter(el),
    comment: '',
    createdAt: new Date().toISOString(),
  };
  state.annotations.push(annot);
  state.selectedId = annot.id;
  persist();
  reapplyActive();
  render();
  setTimeout(() => {
    const ta = active.querySelector(`.annot[data-id="${annot.id}"] textarea`);
    if (ta) { ta.focus(); ta.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  }, 60);
}
function deleteAnnot(id) {
  state.annotations = state.annotations.filter(a => a.id !== id);
  if (state.selectedId === id) state.selectedId = null;
  persist(); reapplyActive(); render();
}
/* Remove every annotation whose comment is still blank. Empty annotations are
   transient (a click that never got a comment) and never reach the brief. */
function pruneEmpty() {
  const before = state.annotations.length;
  state.annotations = state.annotations.filter(a => a.comment.trim() !== '');
  if (state.annotations.length === before) return false;
  if (!state.annotations.some(a => a.id === state.selectedId)) state.selectedId = null;
  persist();
  return true;
}
async function requestDeleteAnnot(id) {
  if (!state.annotations.some(a => a.id === id)) return; // already gone (e.g. pruned)
  const ok = await confirmDialog({
    title: 'Delete annotation',
    message: 'This annotation will be removed. This can’t be undone.',
    confirmLabel: 'Delete',
    danger: true,
  });
  if (ok) { deleteAnnot(id); toast('Annotation deleted'); }
}
function updateComment(id, text) {
  const a = state.annotations.find(x => x.id === id);
  if (a) { a.comment = text; persist(); }
}

/* =========================================================
   Badges inside the iframe
   ========================================================= */
function reapply(doc) {
  if (!doc) return;
  doc.querySelectorAll('.__pp-tagged, .__pp-selected').forEach(el => {
    el.classList.remove('__pp-tagged', '__pp-selected');
    el.removeAttribute('data-pp-num');
  });
  state.annotations.forEach((a, i) => {
    try {
      const found = doc.querySelectorAll(a.selector);
      if (found.length) {
        const el = found[0];
        el.classList.add('__pp-tagged');
        el.setAttribute('data-pp-num', (i + 1).toString());
        if (state.selectedId === a.id) el.classList.add('__pp-selected');
      }
    } catch (e) {}
  });
}
function reapplyActive() { reapply(activeDoc()); }

/* =========================================================
   Sidebar render (into the active shell)
   ========================================================= */
function render() {
  if (!active) return;
  const list = q('annot-list');
  list.innerHTML = '';

  const gc = q('global-comment');
  if (gc && gc.value !== state.globalComment) gc.value = state.globalComment;

  const doc = activeDoc();
  state.annotations
    .map((a, i) => ({ a, n: i + 1 }))
    .forEach(({ a, n }) => {
      const found = elementExists(doc, a.selector);
      const el = document.createElement('div');
      el.className = 'annot'
        + (state.selectedId === a.id ? ' selected' : '')
        + (found ? '' : ' missing');
      el.dataset.id = a.id;
      el.innerHTML = `
        <div class="annot-head">
          <span class="annot-num">#${n}${found ? '' : ' &middot; missing'}</span>
          <div class="annot-actions">
            <button type="button" data-act="locate" title="Scroll to element" aria-label="Scroll to element"${found ? '' : ' disabled'}>&#8675;</button>
            <button type="button" data-act="del" class="danger" title="Delete" aria-label="Delete">&#10005;</button>
          </div>
        </div>
        <div class="annot-selector">${escapeHtml(a.selector)}</div>
        ${found ? '' : '<div class="annot-warn">⚠ This element isn’t on the page anymore.</div>'}
        <div class="annot-preview" title="${escapeHtml(a.outerHTML)}">${escapeHtml(a.outerHTML)}</div>
        <textarea placeholder="What needs to change here?">${escapeHtml(a.comment)}</textarea>`;

      el.addEventListener('click', (e) => {
        if (e.target.closest('textarea') || e.target.closest('button')) return;
        state.selectedId = a.id;
        reapplyActive(); render();
        scrollToElement(a.selector);
      });
      const ta = el.querySelector('textarea');
      ta.addEventListener('input', (e) => updateComment(a.id, e.target.value));
      // Leaving a still-blank annotation discards it automatically.
      ta.addEventListener('blur', (e) => {
        const cur = state.annotations.find(x => x.id === a.id);
        if (!cur || cur.comment.trim() !== '') return;
        const rt = e.relatedTarget;
        const nextCard = rt && rt.closest ? rt.closest('.annot') : null;
        const nextId = nextCard ? nextCard.dataset.id : null;
        const intoTextarea = rt && rt.tagName === 'TEXTAREA';
        deleteAnnot(a.id);
        if (intoTextarea && nextId) {
          const nta = active && active.querySelector(`.annot[data-id="${nextId}"] textarea`);
          if (nta) { nta.focus(); try { nta.setSelectionRange(nta.value.length, nta.value.length); } catch (e2) {} }
        }
      });
      el.querySelector('[data-act="locate"]').addEventListener('click', (e) => { e.stopPropagation(); scrollToElement(a.selector); });
      el.querySelector('[data-act="del"]').addEventListener('click', (e) => { e.stopPropagation(); requestDeleteAnnot(a.id); });
      list.appendChild(el);
    });

  const n = state.annotations.length;
  q('counts').textContent = n + (n === 1 ? ' annotation' : ' annotations');
  q('mode-inspect').classList.toggle('on', state.mode === 'inspect');
  q('mode-browse').classList.toggle('on', state.mode === 'browse');
}

function scrollToElement(selector) {
  const doc = activeDoc();
  if (!doc) return;
  try {
    const el = doc.querySelector(selector);
    if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  } catch (e) {}
}

/* =========================================================
   Mode + foot actions
   ========================================================= */
function setMode(m) {
  state.mode = m;
  const doc = activeDoc();
  if (doc) doc.body.classList.toggle('__pp-inspect', m === 'inspect');
  if (m === 'browse') hideHover();
  render();
}
async function clearAll() {
  if (!state.annotations.length) { toast('No annotations to clear'); return; }
  const n = state.annotations.length;
  const ok = await confirmDialog({
    title: 'Clear all annotations',
    message: `Delete all ${n} annotation${n === 1 ? '' : 's'}? This can’t be undone.`,
    confirmLabel: 'Clear all',
    danger: true,
  });
  if (!ok) return;
  state.annotations = [];
  state.selectedId = null;
  persist(); reapplyActive(); render();
  toast('Cleared all annotations');
}

/* =========================================================
   Direction switch (single shell, kept for engine symmetry)
   ========================================================= */
function switchTo(dir) {
  Object.values(shells).forEach(s => { s.el.hidden = true; });
  active = shells[dir].el;
  active.hidden = false;
  const doc = activeDoc();
  if (doc) { doc.body.classList.toggle('__pp-inspect', state.mode === 'inspect'); reapply(doc); }
  render();
}

/* =========================================================
   Brief builder → markdown handed back to Claude Code
   ========================================================= */
function buildBrief() {
  const items = state.annotations.filter(a => a.comment.trim() !== '');
  const L = [];
  L.push('# UI Feedback');
  L.push('');
  L.push('**File:** `' + CFG.filePath + '`');
  L.push('');
  if (state.globalComment.trim()) {
    L.push('## Page-wide note');
    L.push('');
    L.push(state.globalComment.trim());
    L.push('');
  }
  L.push(`## ${items.length} element annotation${items.length === 1 ? '' : 's'}`);
  L.push('');
  items.forEach((a, i) => {
    L.push(`### #${i + 1} — \`${a.selector}\``);
    L.push('');
    L.push(`**Element:** \`<${a.tag}>\`${a.text ? ` — "${a.text}"` : ''}`);
    L.push('');
    L.push('```html');
    L.push(a.outerHTML);
    L.push('```');
    L.push('');
    L.push(`**Feedback:** ${a.comment.trim()}`);
    L.push('');
  });
  return L.join('\n');
}

/* =========================================================
   Finalize — POST the result to the local server, which
   prints it to stdout and resumes the Claude Code session.
   ========================================================= */
async function postFinalize(payload) {
  try {
    await fetch(CFG.apiBase + '/finalize', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
      keepalive: true,
    });
    return true;
  } catch (e) {
    return false;
  }
}

let finalized = false;
async function onSend() {
  if (finalized) return;
  pruneEmpty();
  render();
  if (!state.annotations.length && !state.globalComment.trim()) {
    toast('Nothing to send yet — add a note or annotate an element');
    return;
  }
  finalized = true;
  const brief = buildBrief();
  stopHeartbeat();
  const ok = await postFinalize({ action: 'feedback', brief });
  showDone('feedback', ok);
}
async function onApprove() {
  if (finalized) return;
  pruneEmpty();
  render();
  const count = state.annotations.length;
  if (count || state.globalComment.trim()) {
    const ok = await confirmDialog({
      title: 'Approve anyway?',
      message: `You have ${count} annotation${count === 1 ? '' : 's'} that won’t be sent. Approve with no feedback?`,
      confirmLabel: 'Approve anyway',
    });
    if (!ok) return;
  }
  finalized = true;
  stopHeartbeat();
  const ok = await postFinalize({ action: 'approve' });
  showDone('approve', ok);
}

function showDone(kind, ok) {
  hideHover();
  const title = document.getElementById('done-title');
  const msg = document.getElementById('done-msg');
  if (kind === 'approve') {
    title.textContent = 'Approved';
    msg.textContent = 'No changes requested. You can close this tab and return to Claude Code.';
  } else {
    title.textContent = 'Feedback sent';
    msg.textContent = 'Your annotations are on their way to Claude Code. You can close this tab.';
  }
  if (!ok) {
    msg.textContent = 'The review session has ended. You can close this tab and return to Claude Code.';
  }
  document.getElementById('done').classList.add('show');
}

/* =========================================================
   Heartbeat — lets the CLI tell a reload (brief gap) apart
   from a real tab close (heartbeat stops → CLI aborts).
   ========================================================= */
let heartbeatTimer = null;
function startHeartbeat() {
  const ping = () => { fetch(CFG.apiBase + '/heartbeat', { method: 'POST', keepalive: true }).catch(() => {}); };
  ping();
  heartbeatTimer = setInterval(ping, 1000);
}
function stopHeartbeat() {
  if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
}

/* =========================================================
   Toast + themed confirm dialog (replace native alert/confirm)
   ========================================================= */
let toastTimer = null;
function toast(msg, ms = 1900) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

const confirmModal = document.getElementById('confirm-modal');
let confirmResolver = null;
function confirmDialog({ title = 'Confirm', message = '', confirmLabel = 'Confirm', danger = false } = {}) {
  hideHover();
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent = message;
  const ok = document.getElementById('confirm-ok');
  ok.textContent = confirmLabel;
  ok.classList.toggle('danger-btn', danger);
  confirmModal.classList.add('show');
  setTimeout(() => ok.focus(), 30);
  return new Promise(res => { confirmResolver = res; });
}
function closeConfirm(result) {
  confirmModal.classList.remove('show');
  if (confirmResolver) { confirmResolver(result); confirmResolver = null; }
}
document.getElementById('confirm-ok').onclick = () => closeConfirm(true);
document.getElementById('confirm-cancel').onclick = () => closeConfirm(false);
confirmModal.addEventListener('click', (e) => { if (e.target === confirmModal) closeConfirm(false); });

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (confirmModal.classList.contains('show')) closeConfirm(false);
});

/* =========================================================
   Theme toggle (light <-> dark) — swaps body[data-theme] tokens
   ========================================================= */
function applyTheme() {
  document.body.dataset.theme = state.theme;
  document.querySelectorAll('[data-role="theme-icon"]').forEach(el => {
    el.textContent = state.theme === 'dark' ? '☀️' : '🌙'; // sun / moon
  });
  document.querySelectorAll('[data-role="theme-toggle"]').forEach(b => {
    b.title = state.theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
  });
}
function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  persist();
}

/* =========================================================
   Boot
   ========================================================= */
window.addEventListener('blur', hideHover);
loadPersisted();
buildShells();
applyTheme();
switchTo('a');
startHeartbeat();
</script>
</body>
