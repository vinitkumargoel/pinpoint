<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pinpoint — HTML Annotator</title>
<!-- PINPOINT_STYLES -->
</head>
<body data-theme="light">

<div id="shells"></div>

<div class="hover-label" id="hover-label"></div>

<div class="modal" id="confirm-modal">
  <div class="modal-card confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-msg">
    <div class="modal-head">
      <h3 id="confirm-title">Confirm</h3>
    </div>
    <div class="modal-body"><p id="confirm-msg"></p></div>
    <div class="modal-foot">
      <button type="button" class="btn" id="confirm-cancel">Cancel</button>
      <button type="button" class="btn primary" id="confirm-ok">Confirm</button>
    </div>
  </div>
</div>

<div class="done-overlay" id="done" role="status" aria-live="polite">
  <div class="done-card">
    <div class="done-icon" id="done-icon">&#10003;</div>
    <h2 id="done-title">Feedback sent</h2>
    <p id="done-msg">You can close this tab and return to Claude Code.</p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="kbs-panel" id="kbs-panel" aria-hidden="true">
  <h4>Keyboard Shortcuts</h4>
  <div class="kbs-row"><span>Inspect mode</span><div class="kbs-keys"><kbd>I</kbd></div></div>
  <div class="kbs-row"><span>Browse mode</span><div class="kbs-keys"><kbd>B</kbd></div></div>
  <div class="kbs-sep"></div>
  <div class="kbs-row"><span>Page-wide note</span><div class="kbs-keys"><kbd>G</kbd></div></div>
  <div class="kbs-row"><span>Jump to annotation</span><div class="kbs-keys"><kbd>1</kbd>&thinsp;–&thinsp;<kbd>9</kbd></div></div>
  <div class="kbs-row"><span>Deselect</span><div class="kbs-keys"><kbd>Esc</kbd></div></div>
  <div class="kbs-sep"></div>
  <div class="kbs-row"><span>Toggle theme</span><div class="kbs-keys"><kbd>T</kbd></div></div>
  <div class="kbs-sep"></div>
  <div class="kbs-row"><span>Send / Approve</span><div class="kbs-keys"><kbd>⌘</kbd><kbd>↵</kbd></div></div>
  <div class="kbs-row"><span>Clear all</span><div class="kbs-keys"><kbd>⌘</kbd><kbd>⇧</kbd><kbd>X</kbd></div></div>
</div>

<!-- PINPOINT_SCRIPT -->
</body>
</html>
